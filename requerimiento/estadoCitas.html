<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Psicólogo - Control de Citas</title>

    <!-- CDN de Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

</head>
<body class="bg-light">

    <div class="container my-4 p-4 bg-white rounded shadow-sm">
        
        <!-- Encabezado con Logo -->
        <div class="d-flex align-items-center mb-4 gap-3">
            <img src="img/logoUPP.png" alt="Logo UPP" width="100">
            <h1 class="h2 m-0 text-purple">Portal del Psicólogo</h1>
        </div>

        <!-- Navegación -->
        <nav class="mb-4">
            <ul class="nav nav-pills">
                <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Ayuda y Soporte</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
            </ul>
        </nav>

        <hr>

        <h2 class="h4 text-purple">Control de Citas</h2>
        <p class="text-muted">Seleccione una cita y marque el estado de asistencia correspondiente.</p>

        <!-- Formulario -->
        <form id="form-registro-estado" action="#" method="POST" class="mt-3">
            
            <div class="mb-3">
                <label for="id-cita" class="form-label fw-bold">Seleccionar Cita:</label>
                <select id="id-cita" name="id_cita" class="form-select" required>
                    <option value="" disabled selected>-- Seleccione una cita --</option>
                    <option value="101">Cita #101 - Estudiante: Carlos Gómez (10:00 hrs)</option>
                    <option value="102">Cita #102 - Estudiante: Ana Martínez (11:30 hrs)</option>
                    <option value="103">Cita #103 - Estudiante: Luis Fernández (16:00 hrs)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="estado-cita" class="form-label fw-bold">Estado de la Cita:</label>
                <select id="estado-cita" name="estado_cita" class="form-select" required>
                    <option value="" disabled selected>-- Marque el estado --</option>
                    <option value="atendida">Atendida</option>
                    <option value="cancelada">Cancelada</option>
                    <option value="no_asistida">No asistida</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="observaciones" class="form-label fw-bold">Observaciones (Opcional):</label>
                <textarea id="observaciones" name="observaciones" class="form-control" rows="4" placeholder="Ingrese notas adicionales si es necesario..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-purple">Guardar Estado</button>
                <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
            </div>

        </form>

        <hr class="mt-5">

        <footer>
            <p class="text-center text-muted small">&copy; 2026 Universidad Politécnica de Pachuca — Portal Estudiantil. Todos los derechos reservados. 𑄝੭</p>
        </footer>

    </div>

</body>
</html>
