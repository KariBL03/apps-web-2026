<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenteSana - Control de Citas</title>

    <!-- Fuente Roboto (según guía de estilo MenteSana) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    
</head>
<body>

    <div class="container my-5 p-4 bg-white card-mentesana shadow-sm">
        
        <!-- Encabezado con Logo y Marca -->
        <div class="d-flex align-items-center mb-4 gap-3">
            <img src="img/logoUPP.png" alt="Logo MenteSana" width="90">
            <div>
                <h1 class="h2 m-0 text-purple-ms fw-bold">MenteSana</h1>
                <small class="text-muted">Portal del Psicólogo — Control de Citas</small>
            </div>
        </div>

        <!-- Navegación -->
        <nav class="mb-4">
            <ul class="nav nav-pills">
                <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Ayuda y Soporte</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
            </ul>
        </nav>

        <hr style="color: #DCEEFF;">

        <h2 class="h4 text-purple-ms fw-bold">Control de Citas</h2>
        <p class="text-muted">Seleccione una cita y marque el estado de asistencia correspondiente.</p>

        <!-- Formulario -->
        <form id="form-registro-estado" action="#" method="POST" class="mt-4">
            
            <div class="mb-3">
                <label for="id-cita" class="form-label fw-bold">Seleccionar Cita:</label>
                <select id="id-cita" name="id_cita" class="form-select" required>
                    <option value="" disabled selected>-- Seleccione una cita --</option>
                    <option value="101">Cita #101 - Estudiante: Carlos Gómez (10:00 hrs)</option>
                    <option value="102">Cita #102 - Estudiante: Ana Martínez (11:30 hrs)</option>
                    <option value="103">Cita #103 - Estudiante: Luis Fernández (16:00 hrs)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="estado-cita" class="form-label fw-bold">Estado de la Cita:</label>
                <select id="estado-cita" name="estado_cita" class="form-select" required>
                    <option value="" disabled selected>-- Marque el estado --</option>
                    <option value="atendida">Atendida</option>
                    <option value="cancelada">Cancelada</option>
                    <option value="no_asistida">No asistida</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="observaciones" class="form-label fw-bold">Observaciones (Opcional):</label>
                <textarea id="observaciones" name="observaciones" class="form-control" rows="4" placeholder="Ingrese notas adicionales si es necesario..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-blue-ms px-4 py-2">Guardar Estado</button>
                <button type="reset" class="btn btn-outline-ms px-4 py-2">Limpiar</button>
            </div>

        </form>

        <hr class="mt-5" style="color: #DCEEFF;">

        <footer>
            <p class="text-center text-muted small m-0">&copy; 2026 MenteSana — Universidad Politécnica de Pachuca. Todos los derechos reservados.</p>
        </footer>

    </div>

</body>
</html>
